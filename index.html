<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archi Tasker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1d23;
    color: #e8eaf0;
    min-height: 100vh;
    padding: 24px;
    overflow-x: hidden;
  }
  h1 { font-size: 28px; margin-bottom: 20px; }
  h1 small { color: #8b90a0; font-weight: normal; font-size: 14px; margin-left: 10px; }

  .bar {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left;
    background: #2a2f3a; border: none; border-radius: 12px;
    color: #e8eaf0; font-size: 22px; font-weight: 600;
    padding: 28px 24px; margin-bottom: 14px; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .bar:hover { background: #343b49; }
  .bar:active { transform: scale(.99); }
  .bar.all-done { background: #2a3a2f; border-left: 5px solid #3fbf6f; }
  .bar.has-todo { background: #3a352a; border-left: 5px solid #e8a13c; }
  .bar .meta { font-size: 14px; color: #8b90a0; font-weight: normal; margin-left: 12px; }
  .bar .del { color: #ff6b6b; font-size: 18px; padding: 4px 10px; border-radius: 8px; }
  .bar .del:hover { background: #3a2530; }

  .add-row { display: flex; gap: 10px; margin-top: 8px; }
  input[type=text], textarea {
    flex: 1; background: #232733; border: 1px solid #3a4152; border-radius: 10px;
    color: #e8eaf0; font-size: 18px; padding: 14px 16px; outline: none;
  }
  input[type=text]:focus, textarea:focus { border-color: #5b8cff; }
  textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  button.add {
    background: #5b8cff; border: none; border-radius: 10px; color: #fff;
    font-size: 18px; font-weight: 600; padding: 14px 28px; cursor: pointer;
  }
  button.add:hover { background: #4a7bef; }

  .back {
    background: none; border: none; color: #8b90a0; font-size: 16px;
    cursor: pointer; margin-bottom: 16px; padding: 0;
  }
  .back:hover { color: #e8eaf0; }

  .task {
    display: flex; align-items: center; gap: 14px;
    background: #2a2f3a; border-radius: 12px; padding: 18px 20px;
    margin-bottom: 12px; font-size: 19px;
    cursor: grab; user-select: none;
  }
  .task:active { cursor: grabbing; }
  .task.dragging { opacity: .4; }
  .task.drag-over { border-top: 3px solid #5b8cff; }
  .task .name { flex: 1; }
  .task.done .name { color: #6fbf8f; }
  .task .status-btn {
    border: none; border-radius: 8px; padding: 8px 16px; font-size: 15px;
    font-weight: 600; cursor: pointer; color: #fff;
  }
  .task .status-btn.todo { background: #e8a13c; }
  .task .status-btn.done { background: #3fbf6f; }
  .task .del { background: none; border: none; color: #ff6b6b; font-size: 20px; cursor: pointer; padding: 8px 12px; min-width: 44px; min-height: 44px; }
  .task .del:hover { color: #ff9b9b; }
  .task .desc-toggle { background: none; border: none; color: #8b90a0; font-size: 16px; cursor: pointer; padding: 4px 8px; }
  .task .desc-toggle:hover { color: #e8eaf0; }
  .task .edit-btn { background: none; border: none; color: #5b8cff; font-size: 16px; cursor: pointer; padding: 4px 8px; }
  .task .edit-btn:hover { color: #7ba8ff; }
  .task .move-btn { background: none; border: none; color: #8b90a0; font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .task .move-btn:hover { color: #e8eaf0; }
  .task .desc { display: none; font-size: 15px; color: #8b90a0; margin-top: 10px; padding-top: 10px; border-top: 1px solid #3a4152; white-space: pre-wrap; }
  .task .desc.open { display: block; }
  .task .edit-form { display: none; flex-direction: column; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #3a4152; width: 100%; max-width: 100%; box-sizing: border-box; }
  .task .edit-form.open { display: flex; }
  .task .edit-form input, .task .edit-form textarea { font-size: 15px; padding: 10px 12px; width: 100%; box-sizing: border-box; }

  .edit-modal {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #1a1d23; z-index: 1000; padding: 20px;
    flex-direction: column; gap: 12px; overflow-y: auto;
  }
  .edit-modal.open { display: flex; }
  .edit-modal h2 { font-size: 20px; margin-bottom: 8px; }
  .edit-modal input, .edit-modal textarea {
    width: 100%; background: #232733; border: 1px solid #3a4152; border-radius: 10px;
    color: #e8eaf0; font-size: 16px; padding: 14px 16px; outline: none; box-sizing: border-box;
  }
  .edit-modal textarea { resize: vertical; min-height: 100px; font-family: inherit; }
  .edit-modal .buttons { display: flex; gap: 10px; margin-top: 10px; }
  .edit-modal button { flex: 1; padding: 14px 20px; font-size: 16px; }

  .empty { color: #8b90a0; font-size: 18px; padding: 20px 0; }
  .loading { color: #8b90a0; font-size: 18px; padding: 20px 0; }
  .error { color: #ff6b6b; font-size: 18px; padding: 20px 0; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    h1 { font-size: 22px; margin-bottom: 16px; }
    h1 small { font-size: 12px; margin-left: 8px; display: block; margin-top: 4px; margin-left: 0; }
    .bar { font-size: 18px; padding: 20px 16px; }
    .bar .meta { font-size: 12px; margin-left: 8px; }
    .bar .del { font-size: 16px; padding: 4px 8px; }
    .add-row { flex-direction: column; gap: 8px; }
    input[type=text], textarea { font-size: 16px; padding: 12px 14px; }
    button.add { font-size: 16px; padding: 12px 20px; width: 100%; }
    .task { font-size: 16px; padding: 14px 16px; }
    .task .status-btn { font-size: 13px; padding: 6px 12px; }
    .task .del { font-size: 18px; }
    .task .desc { font-size: 14px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="editModal" class="edit-modal">
  <h2>Редактировать задачу</h2>
  <input type="text" id="editTaskName" placeholder="Название">
  <textarea id="editTaskDesc" placeholder="Описание" maxlength="1000"></textarea>
  <div class="buttons">
    <button class="add" id="saveEdit" style="flex: 2;">Сохранить</button>
    <button class="add" id="cancelEdit" style="background: #666; flex: 1;">Отмена</button>
  </div>
  <button class="add" id="deleteEdit" style="background: #ff6b6b; margin-top: 10px;">Удалить задачу</button>
</div>

<script>
const API_BASE = '/api';
let state = null;
let view = null;
let editingTaskId = null;

async function api(path, options = {}) {
  try {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
    });
    if (!res.ok) throw new Error(`API error: ${res.status}`);
    return res.status === 204 ? null : res.json();
  } catch (e) {
    console.error('API error:', e);
    alert('Ошибка: ' + e.message);
    throw e;
  }
}

async function load() {
  try {
    state = await api('/state');
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="error">Ошибка загрузки: ${e.message}</div>`;
  }
}

function render() {
  const app = document.getElementById('app');
  if (!state) { app.innerHTML = `<div class="loading">Загрузка...</div>`; return; }
  if (view === null) app.innerHTML = renderCategories();
  else app.innerHTML = renderTasks(view);
  bind();
}

function renderCategories() {
  const cats = state.categories;
  let html = `<h1>Archi Tasker<small>${cats.length} категорий</small></h1>`;
  for (const c of cats) {
    const total = c.tasks.length;
    const done = c.tasks.filter(t => t.status === 'done').length;
    const allDone = total > 0 && done === total;
    const cls = allDone ? 'all-done' : 'has-todo';
    html += `<button class="bar ${cls}" data-open="${c.id}">
      ${esc(c.name)}
      <span class="meta">${done}/${total} выполнено</span>
      <span class="del" data-del-cat="${c.id}" title="Удалить категорию">✕</span>
    </button>`;
  }
  html += `<div class="add-row">
    <input type="text" id="newCat" placeholder="Название новой категории..." maxlength="80">
    <button class="add" id="addCat">+ Категория</button>
  </div>`;
  return html;
}

function renderTasks(catId) {
  const c = state.categories.find(x => x.id === catId);
  if (!c) { view = null; return renderCategories(); }
  let html = `<button class="back" id="back">← Все категории</button>
    <h1>${esc(c.name)}<small>${c.tasks.length} задач</small></h1>`;
  if (c.tasks.length === 0) html += `<div class="empty">Задач пока нет — добавьте первую ниже.</div>`;
  for (const t of c.tasks) {
    const isDone = t.status === 'done';
    const hasDesc = t.description && t.description.trim();
    const idx = c.tasks.indexOf(t);
    html += `<div class="task ${isDone ? 'done' : ''}" draggable="true" data-task-row="${t.id}">
      <span class="name">${esc(t.name)}</span>
      ${hasDesc ? `<button class="desc-toggle" draggable="false" data-toggle-desc="${t.id}">▼</button>` : ''}
      <button class="move-btn" draggable="false" data-move-up="${t.id}" title="Вверх">▲</button>
      <button class="move-btn" draggable="false" data-move-down="${t.id}" title="Вниз">▼</button>
      <button class="edit-btn" draggable="false" data-edit="${t.id}" title="Редактировать">✎</button>
      <button class="status-btn ${isDone ? 'done' : 'todo'}" draggable="false" data-toggle="${t.id}">${isDone ? 'Выполнено' : 'В работе'}</button>
      ${hasDesc ? `<div class="desc" data-desc="${t.id}">${esc(t.description)}</div>` : ''}
    </div>`;
  }
  html += `<div class="add-row" style="flex-direction: column;">
    <input type="text" id="newTask" placeholder="Название новой задачи..." maxlength="120">
    <textarea id="newTaskDesc" placeholder="Описание задачи (необязательно)..." maxlength="1000" style="margin-top: 8px;"></textarea>
    <button class="add" id="addTask" style="margin-top: 8px;">+ Задача</button>
  </div>`;
  return html;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function bind() {
  document.querySelectorAll('[data-open]').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-del-cat]')) return;
      view = el.dataset.open; render();
    });
  });
  document.querySelectorAll('[data-del-cat]').forEach(el => {
    el.addEventListener('click', async e => {
      e.stopPropagation();
      e.preventDefault();
      const c = state.categories.find(x => x.id === el.dataset.delCat);
      if (!c) return;
      await api(`/categories/${c.id}`, { method: 'DELETE' });
      await load();
    });
  });
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', async () => {
      const c = state.categories.find(x => x.id === view);
      const t = c.tasks.find(x => x.id === el.dataset.toggle);
      const newStatus = t.status === 'done' ? 'todo' : 'done';
      await api(`/tasks/${t.id}`, { method: 'PATCH', body: JSON.stringify({ status: newStatus }) });
      await load();
    });
  });
  document.querySelectorAll('[data-task-row]').forEach(el => {
    el.addEventListener('dragstart', e => {
      if (e.target.closest('button')) return;
      e.dataTransfer.setData('text/plain', el.dataset.taskRow);
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('dragover', e => {
      e.preventDefault();
      document.querySelectorAll('.task.drag-over').forEach(x => x.classList.remove('drag-over'));
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', async e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      const dragId = e.dataTransfer.getData('text/plain');
      const targetId = el.dataset.taskRow;
      if (!dragId || dragId === targetId) return;
      const c = state.categories.find(x => x.id === view);
      const order = c.tasks.map(t => t.id);
      const from = order.indexOf(dragId);
      const to = order.indexOf(targetId);
      if (from < 0 || to < 0) return;
      order.splice(from, 1);
      order.splice(to, 0, dragId);
      await api('/reorder', { method: 'POST', body: JSON.stringify({ category: view, order }) });
      await load();
    });
  });

  document.querySelectorAll('[data-move-up]').forEach(el => {
    el.addEventListener('click', async e => {
      e.stopPropagation();
      const taskId = el.dataset.moveUp;
      const c = state.categories.find(x => x.id === view);
      const idx = c.tasks.findIndex(x => x.id === taskId);
      if (idx <= 0) return;
      const order = c.tasks.map(x => x.id);
      [order[idx], order[idx - 1]] = [order[idx - 1], order[idx]];
      await api('/reorder', { method: 'POST', body: JSON.stringify({ category: view, order }) });
      await load();
    });
  });

  document.querySelectorAll('[data-move-down]').forEach(el => {
    el.addEventListener('click', async e => {
      e.stopPropagation();
      const taskId = el.dataset.moveDown;
      const c = state.categories.find(x => x.id === view);
      const idx = c.tasks.findIndex(x => x.id === taskId);
      if (idx >= c.tasks.length - 1) return;
      const order = c.tasks.map(x => x.id);
      [order[idx], order[idx + 1]] = [order[idx + 1], order[idx]];
      await api('/reorder', { method: 'POST', body: JSON.stringify({ category: view, order }) });
      await load();
    });
  });

  document.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const taskId = el.dataset.edit;
      const c = state.categories.find(x => x.id === view);
      const t = c.tasks.find(x => x.id === taskId);
      if (!t) return;
      editingTaskId = taskId;
      document.getElementById('editTaskName').value = t.name;
      document.getElementById('editTaskDesc').value = t.description || '';
      document.getElementById('editModal').classList.add('open');
    });
  });

  document.getElementById('cancelEdit').addEventListener('click', () => {
    document.getElementById('editModal').classList.remove('open');
    editingTaskId = null;
  });

  document.getElementById('saveEdit').addEventListener('click', async () => {
    const name = document.getElementById('editTaskName').value.trim();
    const description = document.getElementById('editTaskDesc').value.trim();
    if (!name || !editingTaskId) return;
    await api(`/tasks/${editingTaskId}`, { method: 'PATCH', body: JSON.stringify({ name, description: description || undefined }) });
    document.getElementById('editModal').classList.remove('open');
    editingTaskId = null;
    await load();
  });

  document.getElementById('deleteEdit').addEventListener('click', async () => {
    if (!editingTaskId) return;
    await api(`/tasks/${editingTaskId}`, { method: 'DELETE' });
    document.getElementById('editModal').classList.remove('open');
    editingTaskId = null;
    await load();
  });

  document.querySelectorAll('[data-toggle-desc]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const descEl = document.querySelector(`[data-desc="${el.dataset.toggleDesc}"]`);
      if (descEl) descEl.classList.toggle('open');
    });
  });

  const back = document.getElementById('back');
  if (back) back.addEventListener('click', () => { view = null; render(); });

  const addCat = document.getElementById('addCat');
  if (addCat) {
    const inp = document.getElementById('newCat');
    const doAdd = async () => {
      const name = inp.value.trim();
      if (!name) return;
      await api('/categories', { method: 'POST', body: JSON.stringify({ name }) });
      inp.value = '';
      await load();
    };
    addCat.addEventListener('click', doAdd);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
  }
  const addTask = document.getElementById('addTask');
  if (addTask) {
    const inp = document.getElementById('newTask');
    const descInp = document.getElementById('newTaskDesc');
    const doAdd = async () => {
      const name = inp.value.trim();
      if (!name) return;
      const description = descInp.value.trim() || undefined;
      await api('/tasks', { method: 'POST', body: JSON.stringify({ category: view, name, description }) });
      inp.value = '';
      descInp.value = '';
      await load();
    };
    addTask.addEventListener('click', doAdd);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
  }
}

load();
</script>
</body>
</html>
